services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      # qdrant/qdrant:v1.19.0 does not ship curl or wget. Bash is available,
      # so use its TCP socket support to verify the actual HTTP health endpoint.
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
