name: Own-Web quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  static:
    name: typecheck, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run api:check
      - run: npm run test:unit

  integration:
    name: API, security and core browser regressions
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      AUTH_SECRET: ci-only-own-web-secret
      TEST_DB_NAME: own_web_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: API regression including basic comments
        run: npm run test:api
      - name: Security regression
        run: npm run test:security
      - name: Core Explore, Math/TOC, user menu and Draft browser tests
        run: npm run test:e2e -- --project=desktop --grep "guest public routes|article TOC|comment composer|user menu|draft lifecycle"

  scheduled:
    name: nightly performance and visual gates
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      AUTH_SECRET: ci-only-own-web-secret
      TEST_DB_NAME: own_web_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - run: npm run test:performance
      - name: Upload visual and Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit-artifacts-${{ github.run_id }}
          path: audit-artifacts
          if-no-files-found: ignore
